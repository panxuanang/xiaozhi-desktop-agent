name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for optional official Office Skills
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch official Office Skills when available
        shell: powershell
        run: .\scripts\fetch_office_skills.ps1

      - name: Stage private Python runtime and dependencies
        shell: powershell
        run: .\scripts\stage_runtime.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build single installer EXE
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc .\installer\xiaozhi.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-FileHash .\dist\XiaoZhiSetup.exe -Algorithm SHA256 | Format-List

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhiSetup-windows-x64
          path: dist/XiaoZhiSetup.exe
          if-no-files-found: error

      - name: Publish installer on GitHub Release tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/XiaoZhiSetup.exe
          generate_release_notes: true
